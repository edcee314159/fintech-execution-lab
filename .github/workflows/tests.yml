name: Unified research verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: External build, isolated install, regression and smoke
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = "1"
          python tools/bootstrap.py --workspace "D:\Codex\FinTech-Execution-Lab\ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --test
